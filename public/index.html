<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Span</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; }
    main { text-align: center; }
    h1 { margin: 0 0 .25rem; font-size: 2.5rem; letter-spacing: -.02em; }
    p { margin: .25rem 0; opacity: .75; }
    code { font-size: .9em; }
  </style>
</head>
<body>
  <main>
    <h1>Span</h1>
    <p>Travel timeline. The UI is coming soon.</p>
    <p>API: <code id="status">checking…</code></p>
  </main>
  <script type="module">
    const el = document.getElementById("status");
    try {
      const res = await fetch("/api/health");
      const { ok, db } = await res.json();
      el.textContent = ok ? `ok, database ${db ? "ok" : "unreachable"}` : "error";
    } catch {
      el.textContent = "unreachable";
    }
  </script>
</body>
</html>
